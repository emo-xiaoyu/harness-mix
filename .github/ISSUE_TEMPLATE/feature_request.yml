name: "Feature request / 功能建议"
description: "提出新功能或改进建议 / Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索已有 issue，并对照 README 的「原生 Harness 功能支持矩阵」，
        确认这不是已支持或已提出的能力。

  - type: textarea
    id: problem
    attributes:
      label: "要解决什么问题？"
      description: "描述你遇到的使用场景或痛点——功能建议请先讲清楚「为什么」"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "期望的解决方案"
      description: "你希望它如何工作？在 Codex Desktop 原生界面上大概是什么交互？"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "考虑过的替代方案"
      description: "可选：其他你能接受的做法，或目前用来绕过的办法"
    validations:
      required: false

  - type: checkboxes
    id: area
    attributes:
      label: "主要影响的层面"
      description: "可选：帮助我们把 issue 路由给熟悉对应模块的维护者"
      options:
        - label: "适配层（某个 Harness 的 Adapter）"
        - label: "Host Runtime / 协作编排"
        - label: "原生 UI（Renderer 扩展 / Desktop 控制）"
        - label: "安装与发布（安装包 / 更新）"
        - label: "文档"
        - label: "不确定"
