name: Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach rebuilt installers (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Installer (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup show
      - run: npm ci
      - run: npm run build:native

      - name: Ensure Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Ensure create-dmg
        if: runner.os == 'macOS'
        run: command -v create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run dist:windows -- --arch ${{ matrix.arch }}

      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/release/macos/package.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: output/installers/*
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "Expected a v* release tag" >&2; exit 1; }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
